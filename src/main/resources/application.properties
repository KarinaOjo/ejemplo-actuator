spring.application.name=ServicioBase
# Puerto 8000 (antes estaba fijo en el codigo: 8080)
server.port=8000

# Nombre del servicio: sale en el campo "servicio" de cada log
#spring.application.name=A

# Que endpoints de Actuator quedan publicos por HTTP
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# Formato del log: una linea con servicio, nivel y razon
logging.pattern.console={"servicio": "${spring.application.name}", "id": "%X{id}", "nivel": "%level", "razon": "%msg"}%n
pattern.console={"servicio": "${spring.application.name}", "nivel": "%level", "razon": "%msg"}%n